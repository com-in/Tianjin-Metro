modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL="https://github.com/ZiYueCommentary/Tianjin-Metro/issues"

[[mods]]
modId = "tjmetro"
version = "${version}"
displayName = "Tianjin Metro"
displayURL="https://modrinth.com/mod/tianjin-metro"
authors = "ZiYueCommentary"
description = "A small addon for the Minecraft Transit Railway Mod."
logoFile = "icon.png"

[[mixins]]
config = "tjmetro.mixins.json"

[[mixins]]
config = "tjmetro-forge.mixins.json"

[[dependencies.tjmetro]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.tjmetro]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.tjmetro]]
modId = "mtr"
type = "required"
versionRange = "1.0"
ordering = "AFTER"
side = "BOTH"

[[dependencies.tjmetro]]
modId = "filters"
type = "optional"
versionRange = "1.0"
ordering = "AFTER"
side = "CLIENT"