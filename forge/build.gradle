plugins {
    id "net.neoforged.gradle.userdev" version "7.1.38"
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(21))
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    implementation "maven.modrinth:XKPAmI6u:${mtr_neoforge_module}"
    implementation "ziyue.filters:filters-neoforge:${filters_neoforge_version}"
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_neoforge_version}"
    annotationProcessor 'systems.manifold:manifold-preprocessor:+'
}

repositories {
    mavenCentral()
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["-Xmaxerrs", "5000"]
}

sourceSets.main.resources { srcDir "src/generated/resources" }

runs {
    configureEach {
        systemProperty "neoforge.logging.markers", "REGISTRIES"
        systemProperty "neoforge.logging.console.level", "debug"
        modSource sourceSets.main
    }
    client {}
    server { argument "--nogui" }
}

java {
    withSourcesJar()
}

tasks.register("setupFiles") {
    println("Copying resources from Fabric to NeoForge")

    delete fileTree("src/main/java/ziyue/tjmetro/mod")
    delete fileTree("src/main/java/ziyue/centralconfig")
    delete fileTree("src/main/resources/assets")
    delete fileTree("src/main/resources/data")

    copy {
        outputs.upToDateWhen { false }
        from "../fabric/src/main/java/ziyue/tjmetro/mod"
        into "src/main/java/ziyue/tjmetro/mod"
    }

    copy {
        outputs.upToDateWhen { false }
        from "../fabric/src/main/java/ziyue/centralconfig"
        into "src/main/java/ziyue/centralconfig"
    }

    copy {
        outputs.upToDateWhen { false }
        from "../fabric/src/main/resources/assets"
        into "src/main/resources/assets"
    }

    copy {
        outputs.upToDateWhen { false }
        from "../fabric/src/main/resources/data"
        into "src/main/resources/data"
    }

    copy {
        outputs.upToDateWhen { false }
        from("../fabric/src/main/resources/tjmetro.mixins.json") {
            filter { line -> line.replace('"compatibilityLevel": "JAVA_17"', '"compatibilityLevel": "JAVA_21"') }
        }
        into "src/main/resources/"
    }
}