name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build NeoForge 1.21.1 jar
        run: ./gradlew :forge:buildJar --no-daemon --console=plain

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tianjin-Metro-NeoForge-1.21.1
          path: forge/build/libs/*.jar
          if-no-files-found: error
